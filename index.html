<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
<!-- Aadhaar eSign (Digio): paste your eSign service URL below. Leave it empty to hide eSign.
     environment: 'sandbox' for testing, 'production' when live. -->
<script>window.ESIGN_CONFIG = { endpoint: '', environment: 'sandbox' };</script>
</head>
<body>
<title>PMS Account Opening Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one slim working bar above the untouched form pages, which stack on a quiet desk; review opens as a side sheet. */
:root{
  --desk:#e9ece8; --bar:#18201c; --bar-fg:#eef2ea; --bar-mute:#a9b4ab; --accent:#9bc83c; --accent-ink:#1b2a07;
  --violet:#4e50a8; --sheet:#ffffff; --sheet-fg:#18201c; --mute:#5d6a62; --line:#d5dbd4; --warn:#b4580a; --bad:#c62828; --ok:#2e7d32;
  --field:rgba(64,96,214,.075); --field-hover:rgba(64,96,214,.5); --field-focus:#3550c8; --ink:#0f1a3a; --need:rgba(232,128,20,.20);
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-form:"Inter",Arial,Helvetica,sans-serif; --f-hand:"Caveat","Segoe Script","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#232825;--sheet:#1c211e;--sheet-fg:#e8ede6;--mute:#9eaaa1;--line:#38403b;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#232825;--sheet:#1c211e;--sheet-fg:#e8ede6;--mute:#9eaaa1;--line:#38403b;color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--sheet-fg)}
body{font-family:var(--f-ui);font-size:14px;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--field-focus);outline-offset:1px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bar);color:var(--bar-fg);padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}
.bar .ref{font-size:12px;color:var(--bar-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .grow{flex:1 1 0;min-width:0}
.nav{display:flex;align-items:center;gap:4px}
.atype{background:#25302a;border:1px solid var(--accent,#9bc53d);color:var(--bar-fg);border-radius:6px;padding:5px 6px;font:inherit;font-size:13px;font-weight:600;max-width:150px}body[data-atype=""] .atype{border-color:#39463e;font-weight:400}
.atype option,.nav select option{background:#ffffff;color:#18201c}
.nav select{background:#25302a;border:1px solid #39463e;color:var(--bar-fg);border-radius:6px;padding:5px 6px;max-width:210px}
.btn{border:1px solid #3b4840;background:#25302a;color:var(--bar-fg);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#2e3a33}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{padding:6px 8px}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--bar-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .track{width:90px;height:5px;border-radius:3px;background:#36423b;overflow:hidden}
.prog .fill{height:100%;background:var(--accent);width:0}
.saved{font-size:12px;color:var(--bar-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--sheet);color:var(--sheet-fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu .pop button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu .pop button:hover{background:var(--desk)}
.menu .pop label{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer}

/* ---------- pages ---------- */
#doc{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:20px 60px;padding-inline:16px}
.page{position:relative;width:min(100%,920px);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 22px rgba(0,0,0,.08);container-type:inline-size;scroll-margin-top:70px}
.page>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.page .layer{position:absolute;inset:0}
.pno{position:absolute;right:0;top:-17px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}

/* ---------- form controls laid on the original page ---------- */
.fx{position:absolute;box-sizing:border-box;margin:0;border:0;border-radius:1px;background:var(--field);color:var(--ink);font-family:var(--f-form);padding:0 .3em;line-height:1.05;outline:none;text-transform:uppercase;transition:box-shadow .12s,background .12s}
.fx.lc{text-transform:none}
.fx:hover{box-shadow:inset 0 0 0 1px var(--field-hover)}
.fx:focus,.fx:focus-within{background:rgba(255,255,255,.96);box-shadow:inset 0 0 0 1.5px var(--field-focus)}
.fx.c{text-align:center}
.fx.w.has{background:#fff}
.fx.cover{background:#fff}
textarea.fx{resize:none;padding:.25em .3em;line-height:1.2;overflow:auto}
select.fx{appearance:none;-webkit-appearance:none;padding:0 .2em;cursor:pointer;text-align-last:center}
.fx.date{cursor:pointer}
.fx.mob{display:flex;align-items:stretch;padding:0}
.fx.mob select{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:3.4em;padding:0 0 0 .2em;font:inherit;color:var(--mute);cursor:pointer;flex:none}
.fx.mob input{border:0;background:transparent;flex:1;min-width:0;padding:0 .3em;font:inherit;color:inherit;outline:none}
.fx.calc,.fx.mirror{display:flex;align-items:center;justify-content:center;background:rgba(155,200,60,.12);text-transform:none}
.fx.mirror{cursor:pointer;background:var(--field)}
.tick{position:absolute;box-sizing:border-box;border:0;padding:0;margin:0;background:var(--field);cursor:pointer;display:grid;place-items:center;border-radius:1px}
.tick:hover{box-shadow:0 0 0 1px var(--field-hover)}
.tick svg{width:118%;height:118%;opacity:0;transform:scale(.6);transition:opacity .1s,transform .12s;pointer-events:none}
.tick[aria-checked="true"]{background:transparent}
.tick[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.sig{position:absolute;box-sizing:border-box;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.sig:hover,.sig:focus-visible{background:rgba(64,96,214,.06);box-shadow:inset 0 0 0 1px var(--field-hover)}
.sig .hint{position:absolute;right:3px;top:3px;font:500 clamp(7px,1.25cqw,11px)/1 var(--f-ui);color:#fff;background:var(--violet);padding:.35em .65em;border-radius:10px;opacity:.88;pointer-events:none;letter-spacing:.02em}
.sig.has .hint{display:none}
.sig img{max-width:96%;max-height:92%;object-fit:contain;pointer-events:none}
.sig.photo img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.clip{position:absolute;box-sizing:border-box;border:1px solid #9aa6c9;background:#fff;border-radius:3px;cursor:pointer;padding:0;display:grid;place-items:center;color:#3550c8}
.clip svg{width:72%;height:72%}
.clip.has{background:#3550c8;color:#fff;border-color:#3550c8}
.clip .n{position:absolute;right:-5px;top:-6px;background:var(--accent);color:var(--accent-ink);font:600 9px/1 var(--f-ui);border-radius:7px;padding:2px 4px}
.band{position:absolute;pointer-events:none;box-shadow:inset 0 0 0 2px var(--accent);background:rgba(155,200,60,.13);border-radius:2px}
.band span{position:absolute;right:6px;bottom:4px;font:600 11px/1 var(--f-ui);background:var(--accent);color:var(--accent-ink);padding:4px 7px;border-radius:10px}
.off{opacity:.28;pointer-events:none;background:transparent!important}
.bad{box-shadow:inset 0 0 0 1.5px var(--bad)!important;background:rgba(198,40,40,.07)!important}
.tick.bad,.sig.bad{box-shadow:0 0 0 1.5px var(--bad)!important}
body.showreq .need{background:var(--need)!important;box-shadow:inset 0 0 0 1px rgba(232,128,20,.7)}
body.nohl .fx:not(:focus):not(.calc),body.nohl .tick{background:transparent}
body.nohl .fx.w.has,body.nohl .fx.cover{background:#fff}
.flash{animation:flash 1.4s ease-out 1}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent),0 0 0 7px rgba(155,200,60,.35)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.tick svg{transition:none}}

#tip{position:fixed;z-index:70;background:var(--bad);color:#fff;font:500 12px/1.3 var(--f-ui);padding:6px 9px;border-radius:6px;max-width:280px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* ---------- calendar ---------- */
#cal{position:fixed;z-index:80;background:var(--sheet);color:var(--sheet-fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.22);padding:10px;width:268px}
#cal .hd{display:flex;gap:4px;align-items:center;margin-bottom:8px}
#cal .hd select{flex:1;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--sheet)}
#cal .hd button,#cal .ft button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:5px 9px;cursor:pointer}
#cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
#cal .grid b{font-size:11px;color:var(--mute);font-weight:500;padding:3px 0}
#cal .grid button{border:0;background:none;border-radius:6px;padding:6px 0;cursor:pointer}
#cal .grid button:hover{background:var(--desk)}
#cal .grid button.sel{background:var(--accent);color:var(--accent-ink);font-weight:600}
#cal .grid button.today{box-shadow:inset 0 0 0 1px var(--accent)}
#cal .grid button:disabled{opacity:.3;cursor:default}
#cal .ft{display:flex;justify-content:space-between;margin-top:8px;gap:6px}
#cal .fmt{font-size:11px;color:var(--mute);margin-top:6px}

/* ---------- sheets & dialogs ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(10,16,12,.45);display:grid;place-items:center;padding:16px}
.dlg{background:var(--sheet);color:var(--sheet-fg);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px}
.dlg h2{margin:0 0 4px;font-size:18px;font-weight:600;text-wrap:balance}
.dlg .sub{color:var(--mute);margin:0 0 14px;font-size:13px;max-width:62ch}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.dbtn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer}
.dbtn:hover{background:var(--desk)}
.dbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dbtn.danger{color:var(--bad);border-color:rgba(198,40,40,.4)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mute)}
.tabs button[aria-selected="true"]{color:var(--sheet-fg);border-bottom-color:var(--accent);font-weight:600}
.pad{border:1px dashed #9aa3c4;border-radius:8px;background:#fff;touch-action:none;width:100%;display:block;cursor:crosshair}
.guide{font-size:13px;background:var(--desk);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.typed{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sheet)}
.typedprev{font-family:var(--f-hand);font-size:40px;color:#10204a;background:#fff;border-radius:8px;border:1px dashed #9aa3c4;padding:6px 12px;margin-top:8px;min-height:60px;overflow:hidden;white-space:nowrap}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.files{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.files .it{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.files .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .it small{color:var(--mute);font-variant-numeric:tabular-nums}
.preview{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.preview img{display:block;max-width:100%;margin:auto}
.preview iframe{width:100%;height:60vh;border:0;display:block}
.empty{color:var(--mute);font-size:13px;padding:6px 0}

#review{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--sheet);color:var(--sheet-fg);box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#review header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#review header h2{margin:0;font-size:17px}
#review header p{margin:4px 0 0;color:var(--mute);font-size:13px}
#review .tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
#review .list{overflow:auto;padding:8px 10px 30px;flex:1}
#review h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:14px 8px 4px;font-weight:600}
#review .iss{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;align-items:baseline}
#review .iss:hover{background:var(--desk)}
#review .iss .pg{flex:none;font-size:11px;color:var(--mute);width:42px;font-variant-numeric:tabular-nums}
#review .iss .t{flex:1;min-width:0}
#review .iss .why{display:block;font-size:12px;color:var(--bad)}
#review .iss .why.w{color:var(--warn)}
#review .iss .why.m{color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--desk);color:var(--mute);font-weight:600}
.pill.ok{background:rgba(46,125,50,.14);color:var(--ok)}
.pill.no{background:rgba(198,40,40,.12);color:var(--bad)}
.sig.es{outline:1.5px dashed #1f6f4a;background:rgba(31,111,74,.08)!important}.sig.es .hint,.sig.es.has .hint{display:block;background:#1f6f4a;color:#fff;font-weight:600}.sig.es img{display:none}
fieldset.esg{border:1px solid var(--line,#ccd);border-radius:8px;margin:8px 0;padding:6px 10px 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}fieldset.esg legend{font-weight:600;padding:0 4px}fieldset.esg label{display:flex;flex-direction:column;font-size:12px;gap:3px;color:var(--mute)}fieldset.esg input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #bbc;border-radius:6px;color:inherit;background:transparent}
.esr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25)}.esr small{color:var(--mute)}
.cam{position:relative;background:#111;border-radius:10px;overflow:hidden;display:grid;place-items:center;min-height:220px}.cam video,.cam canvas{display:block;width:100%;max-height:60vh;object-fit:contain}.cam video.mirror{transform:scaleX(-1)}.cam .frame{position:absolute;height:100%;max-width:100%;border:2px dashed rgba(255,255,255,.8);border-radius:6px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}.cam canvas:not([hidden])~.frame{display:none}.cam .cammsg{position:absolute;inset:auto 12px 12px;color:#fff;text-align:center;font-size:13px;margin:0}
@media (max-width:1420px){.saved{display:none}.prog .track{width:60px}}
.loaderr{margin:12px auto 0;max-width:920px;background:#fdecea;color:#8a1c1c;border:1px solid #f1b5b0;border-radius:8px;padding:10px 14px;font-size:14px}.page.noimg{min-height:200px;outline:2px dashed #c62828}
.dlbtn{position:absolute;top:1.2%;left:50%;transform:translateX(-50%);z-index:3;border:0;border-radius:16px;padding:6px 14px;background:#5a2fc2;color:#fff;font:600 12px/1 var(--f-ui);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}.dlbtn:hover{filter:brightness(1.1)}
.dlv{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px}.dlv small{color:var(--mute)}.dlv .warnx{color:var(--warn)}
.dlt{width:100%;border-collapse:collapse;font-size:13px}.dlt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}.dlt td:first-child{width:24px}.dlt small{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--bar);color:var(--bar-fg);padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:760px){.bar{position:static;padding:8px 12px;gap:6px 8px}.bar h1{font-size:14px}.prog .track,.saved,.bar .grow{display:none}.nav select{max-width:140px}.btn{padding:5px 9px;font-size:13px}#doc{gap:12px}}
</style>

<header class="bar" id="bar">
  <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
    <h1>PMS Account Opening Form</h1>
    <span class="ref" id="refline">Reference —</span>
  </div>
  <div class="grow"></div>
  <select id="atype" class="atype" aria-label="Type of account opener" title="Type of account opener">
    <option value="">Account type: All pages</option>
    <option value="ind">Individual</option>
    <option value="ni">Non-Individual</option>
    <option value="nri">NRI</option>
  </select>
  <nav class="nav" aria-label="Pages">
    <button class="btn icon" id="prev" title="Previous page" aria-label="Previous page">‹</button>
    <select id="pagesel" aria-label="Go to page"></select>
    <button class="btn icon" id="next" title="Next page" aria-label="Next page">›</button>
  </nav>
  <div class="prog" title="Required entries completed"><div class="track"><div class="fill" id="progfill"></div></div><span id="progtxt">0 / 0</span></div>
  <span class="saved" id="saved">Not saved yet</span>
  <button class="btn" id="btnReview">Review <span class="pill" id="revcount" style="background:#36423b;color:var(--bar-fg)">0</span></button>
  <div class="menu">
    <button class="btn" id="btnMore" aria-haspopup="true" aria-expanded="false">Draft ▾</button>
    <div class="pop" id="morepop" hidden>
      <button id="mSave">Save draft to a file</button>
      <button id="mOpen">Continue from a draft file…</button>
      <label><input type="checkbox" id="mHl" checked> Highlight fillable areas</label>
      <button id="mClear" style="color:var(--bad)">Clear the whole form…</button>
    </div>
  </div>
  <button class="btn" id="btnExport">Download PDF</button>
  <button class="btn primary" id="btnSubmit">Submit</button>
</header>

<div id="loaderr" class="loaderr" role="alert" hidden></div>
<main id="doc" aria-label="Form pages"></main>

<aside id="review" hidden aria-label="Review before submission">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2>Review before submission</h2>
      <button class="dbtn" id="revClose">Close</button>
    </div>
    <p id="revsum">Checking…</p>
    <div class="tools">
      <label class="chk" style="margin:0"><input type="checkbox" id="revMark"> Mark missing entries on the pages</label>
      <span class="pill" id="revstate"></span>
    </div>
  </header>
  <div class="list" id="revlist"></div>
</aside>

<div id="cal" hidden></div>
<div id="tip" hidden></div>
<div id="modalroot"></div>
<input type="file" id="fileDraft" accept=".json,application/json" hidden>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileDocs" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="fileSigImg" accept="image/*" hidden>
<datalist id="dl-country"></datalist>
<datalist id="dl-ccode"></datalist>
<datalist id="dl-state"></datalist>

<script>
window.addEventListener('error', function (e) {
  if (!e || !e.message) return;
  var b = document.getElementById('loaderr'); if (!b || !b.hidden) return;
  b.hidden = false;
  b.textContent = 'The form could not start in this browser (' + e.message + '). Please update the browser or open the link in Chrome or Edge, and send this message to Allvest if it continues.';

<script>

const NI_TYPES = ['Company', 'LLP', 'Partnership', 'Trust', 'HUF', 'Others'];

function ATYPE(){ return (S.meta && S.meta.atype) || ''; }

function pageHidden(p){ const a = ATYPE(); return !!a && HIDE_PAGES[a].includes(p); }
function NONIND(){ if (ATYPE()) return ATYPE() === 'ni'; const t = v('sa_type'); if (t) return NI_TYPES.includes(t); return filled('ni_pan') || filled('ni_name') || filled('ni_etype'); }
function IND(){ return !NONIND(); }
function H2(){ const h = v('pta_hold'); if (h) return h === 'Joint Holding'; return filled('k2_pan') || filled('k2_fname'); }

function age(iso){ if (!iso) return null; const d = new Date(iso + 'T00:00:00'), t = new Date(); if (isNaN(d)) return null; let a = t.getFullYear() - d.getFullYear(); const m = t.getMonth() - d.getMonth(); if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--; return a; }

  const c = { A: 0, B: 0, C: 0, D: 0, E: 0 }; let n = 0;

const pad2 = n => String(n).padStart(2, '0');

  if (!iso) return '';
  const [y, m, d] = String(iso).split('-').map(Number);
  if (!y || !m || !d) return '';
  switch (fmt) {
    case 'Do': return ord(d);
    case 'Do MMMM': return ord(d) + ' ' + MONTHS[m - 1];
    case 'MMMM YYYY': return MONTHS[m - 1] + ' ' + y;
    case 'DD/MMM/YYYY': return pad2(d) + '/' + MONTHS[m - 1].slice(0, 3) + '/' + y;

}
function parseDMY(s){
  const m = String(s).trim().match(/^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})\s*[\/\-. ]\s*(\d{4})$/);

      return '';

    case 'ccode': return CCODE[s.toUpperCase()] ? '' : 'Choose a 2-letter ISO 3166 country code from the list.';

}

      if (rq) out.push({ f, lbl: f.grplbl, ok: mem.some(x => on(x.id)), els: mem.map(x => EL[x.id]) });

const MAXFILE = 10 * 1024 * 1024;

function dataToBlob(url){ const [h, b] = url.split(','), mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream'; const bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime }); }
function openDocs(f){
  const render = d => {
    const files = S.values[f.id] || [];

/* Set ESIGN_CFG.endpoint to the URL of your eSign service (see esign-worker/README.md).
   While it is empty the eSign option stays hidden and the form works exactly as before. */
const ESIGN_CFG = Object.assign({
  endpoint: '',            // e.g. 'https://allvest-esign.<your-account>.workers.dev'
  environment: 'sandbox',  // 'sandbox' while testing, 'production' when live (must match the service)
  logo: '',                // optional https URL of a logo shown in Digio's signing window
  sdk: 'https://app.digio.in/sdk/v11/digio.js'
}, window.ESIGN_CONFIG || {});

function esignApi_(){ return !!ESIGN_CFG.endpoint; }            // Digio service connected: sign inside the form
function esignAvailable(){ return true; }                           // otherwise: sign on an eSign portal (e.g. Leegality)
function esignOn(){ return !!(S.meta && S.meta.esignMode); }
const ESIGN_PORTAL = ESIGN_CFG.portal || 'Leegality';
const ESIGN_PORTAL_URL = ESIGN_CFG.portalUrl || 'https://app.leegality.com';
/* which holder's Aadhaar eSign goes into this signature box (null = signed by hand / office / witness) */
function esignHolder(f){
  if (f.t !== 'sig' || f.office || f.hand || /wit|seal|stamp|emp_sig/.test(f.id)) return null;
  let m = f.id.match(/^k(\d)_/); if (m) return 'h' + m[1];
  if (f.id === 'ni_sig_dsc') return null;
  if (/^(ni_|rp\d_)/.test(f.id)) return 'h1';
  m = f.id.match(/sig(\d)$/); if (m) return 'h' + m[1];
  return null;
}
const ES_LABEL = { h1: 'Sole / First Holder', h2: 'Second Holder', h3: 'Third Holder' };
function esignHolders(){ const h = ['h1']; if (H2()) h.push('h2'); if (H3()) h.push('h3'); return h; }
function esignGuess(h){
  const n = h[1], ni = h === 'h1' && NONIND();
  const mob = String(v(ni ? 'ni_mobile' : 'k' + n + '_mobile') || '').replace(/\D/g, '').slice(-10);
  return { h, name: String(DER('H' + n + 'NAME') || '').replace(/^(MR|MRS|MS|MISS|DR|MASTER|SHRI|SMT|KUM)\.?\s+/i, '').replace(/\s+/g, ' ').trim(), mobile: mob, email: v(ni ? 'ni_email' : 'k' + n + '_email') || '' };
}
const esignNeeded = f => !f.office && !pageHidden(f.p) && applies(f) && (f.req === true || (typeof f.req === 'string' && E(f.req)));
function esignBox(f){ const h = esignOn() && esignHolder(f); return !!h && esignNeeded(f) && esignHolders().includes(h); }
function esignBoxes(h){ return F.filter(f => esignHolder(f) === h && esignNeeded(f)); }
function esignCoords(signers){
  const out = {};
  signers.forEach(s => {
    const pages = {};
    esignBoxes(s.h).forEach(f => {
      const H = DATA.sizes[f.p - 1][1], [x0, y0, x1, y1] = f.r;
      (pages[f.p] = pages[f.p] || []).push({ llx: +x0.toFixed(2), lly: +(H - y1).toFixed(2), urx: +x1.toFixed(2), ury: +(H - y0).toFixed(2) });
    });
    out[s.identifier] = pages;
  });
  return out;
}

async function esignApi(path, body){
  const url = ESIGN_CFG.endpoint.replace(/\/+$/, '') + path;
  let r;
  try { r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}); }
  catch (e) { throw new Error('The eSign service could not be reached. Check the internet connection and try again.'); }
  if (path.startsWith('/esign/download')) { if (!r.ok) throw new Error('The signed PDF is not ready yet.'); return r.blob(); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('eSign service error ' + r.status));

}
function loadDigio(){
  if (window.Digio) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = ESIGN_CFG.sdk; s.onload = res; s.onerror = () => rej(new Error('The Digio signing window could not be loaded.')); document.head.appendChild(s); });
}
function bytesToB64(bytes){ let s = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s); }

/* ---------- step 1: confirm who signs ---------- */
function esignSetup(){
  return new Promise(resolve => {
    const prev = (S.meta.esignSigners || []).reduce((a, s) => (a[s.h] = s, a), {});
    const rows = esignHolders().map(h => { const g = Object.assign(esignGuess(h), prev[h] && prev[h].edited ? prev[h] : {}); return g; });
    const dlOn = typeof dlAvailable === 'function' && dlAvailable();
    rows.forEach(r => { const m = (S.meta.digilocker || {})[r.h]; if (m && m.name) { r.dl = m; r.name = m.name; } });
    let warned = false;
    const html = '<h2>Sign with Aadhaar eSign</h2><p class="sub">Each holder signs once with an OTP sent to the mobile number linked to their Aadhaar. The signature is applied to every signature box for that holder (' +
      rows.map(r => ES_LABEL[r.h] + ': ' + esignBoxes(r.h).length + ' boxes').join(', ') + '). Holders who are not with you receive a signing link by SMS / e-mail.' + (dlOn ? ' First verify each holder with <b>DigiLocker</b>: the name as per Aadhaar is then used for the eSign, so the signature matches their Aadhaar.' : '') + '</p>' +
      rows.map((r, i) => '<fieldset class="esg" data-i="' + i + '"><legend>' + ES_LABEL[r.h] + '</legend>' +
        '<label>Name as per Aadhaar<input data-k="name" value="' + esc(r.name) + '" autocomplete="off"></label>' +
        '<label>Mobile (for signing link)<input data-k="mobile" inputmode="numeric" maxlength="10" value="' + esc(r.mobile) + '"></label>' +
        '<label>E-mail (if no mobile)<input data-k="email" type="email" value="' + esc(r.email) + '"></label>' +
        (dlOn ? '<div class="dlv" data-v="' + i + '"></div>' : '') + '</fieldset>').join('') +
      '<p class="sub" style="margin-top:8px">Fill in any remaining hand-written items (witness, Schedule B sentence) before starting. Changes made after the eSign request is created will not appear in the signed PDF.</p>' +
      '<div class="row"><button class="dbtn" data-a="x">Cancel</button><button class="dbtn primary" data-a="go">Create eSign request</button></div>';
    modal(html, d => {
      const drawV = i => {
        const box = d.querySelector('[data-v="' + i + '"]'); if (!box) return; const r = rows[i], fs = box.closest('.esg'), nm = fs.querySelector('[data-k="name"]');

            (diff ? '<br><small class="warnx">The name on the KYC page (' + esc(formName) + ') differs from Aadhaar. Correct the KYC page if needed.</small>' : '') +
            ' <button class="dbtn" data-again="' + i + '" style="padding:4px 10px">Verify again</button>';
        } else {
          nm.readOnly = false;
          box.innerHTML = '<span class="pill no">Not verified</span> <button class="dbtn primary" data-dl="' + i + '" style="padding:5px 12px">Verify with DigiLocker</button> <small>Holder must be present (Aadhaar OTP).</small>';
        }
        const go = async btn => {
          const g = k => fs.querySelector('[data-k="' + k + '"]').value.trim();
          const mobile = g('mobile').replace(/\D/g, ''), email = g('email');

          if (!mobile && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return toast('Enter a mobile number or e-mail for the ' + ES_LABEL[r.h] + '.');

            }

/* ======================= DigiLocker (via Digio KYC) ======================= */
/* Uses the same service address as eSign (ESIGN_CFG.endpoint). Hidden until that is set. */
const DL_PAGES = { 9: 'h1', 11: 'h2', 13: 'h3' };
function dlAvailable(){ return !!ESIGN_CFG.endpoint && ESIGN_CFG.digilocker !== false; }

function dlFind(obj, test, depth = 0){
  if (!obj || typeof obj !== 'object' || depth > 7) return null;
  if (test(obj)) return obj;
  for (const k of Object.keys(obj)) { const r = dlFind(obj[k], test, depth + 1); if (r) return r; }
  return null;
}
function dlDetails(resp){
  const aad = dlFind(resp, o => o.aadhaar && typeof o.aadhaar === 'object')?.aadhaar || dlFind(resp, o => /aadhaar/i.test(o.document_type || '') && (o.name || o.id_number));
  const pan = dlFind(resp, o => o.pan && typeof o.pan === 'object')?.pan || dlFind(resp, o => /^pan/i.test(o.document_type || '') && o.id_number);
  return { aad: aad || {}, pan: pan || {} };
}
function dlDate(s){
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return m[3] + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  return '';
}
function dlState(s){
  s = String(s || '').trim().toLowerCase().replace(/\s+and\s+/g, ' & ');
  if (!s) return '';
  const hit = DATA.states.find(([n]) => n.toLowerCase() === s) || DATA.states.find(([n]) => n.toLowerCase().replace(/[^a-z]/g, '') === s.replace(/[^a-z]/g, ''));
  return hit ? hit[0] : s.toUpperCase();
}
/* turn DigiLocker data into form values for one holder; returns [{k, label, val, show}] */
function dlMap(h, resp){
  const p = 'k' + h[1] + '_', { aad, pan } = dlDetails(resp), out = [];
  const add = (k, label, val, show) => { if (val != null && String(val).trim() !== '') out.push({ k, label, val: String(val).trim(), show: show || String(val).trim() }); };
  const name = String(aad.name || pan.name || '').trim().toUpperCase().split(/\s+/).filter(Boolean);
  if (name.length) { add(p + 'fname', 'First name', name[0]); if (name.length > 2) add(p + 'mname', 'Middle name', name.slice(1, -1).join(' ')); if (name.length > 1) add(p + 'lname', 'Last name', name[name.length - 1]); }
  const dob = dlDate(aad.dob || pan.dob); if (dob) add(p + 'dob', 'Date of birth', dob, fmtDate(dob));
  const g = String(aad.gender || pan.gender || '').toUpperCase()[0]; const gv = { M: 'Male', F: 'Female', T: 'Transgender' }[g]; if (gv) add(p + 'gender', 'Gender', gv);
  const fat = aad.father_name || aad.care_of || ''; if (fat) add(p + 'father', 'Father / Spouse name', String(fat).replace(/^(S\/O|D\/O|W\/O|C\/O)[:\s]*/i, '').toUpperCase());
  const panNo = String(pan.id_number || '').toUpperCase(); if (/^[A-Z]{5}\d{4}[A-Z]$/.test(panNo)) add(p + 'pan', 'PAN', panNo);
  const ad = aad.current_address_details || aad.permanent_address_details || aad.address_details || {};
  const full = String(aad.current_address || aad.permanent_address || aad.address || '');
  const pin = String(ad.pincode || ad.pin_code || (full.match(/\b\d{6}\b/) || [''])[0]);
  const l1 = ad.address || ad.house || full.replace(/\b\d{6}\b/, '').replace(/,\s*$/, '');
  if (l1) {
    add(p + 'ca1', 'Address (line 1)', String(l1).toUpperCase().slice(0, 120));
    add(p + 'ca2', 'Address (line 2)', String(ad.locality_or_post_office || ad.locality || ad.vtc || '').toUpperCase());
    add(p + 'ccity', 'City / Town / Village', String(ad.district_or_city || ad.city || ad.vtc || '').toUpperCase());
    add(p + 'cdist', 'District', String(ad.district || ad.district_or_city || '').toUpperCase());
    add(p + 'cstate', 'State', dlState(ad.state));
    if (/^\d{6}$/.test(pin)) add(p + 'cpin', 'PIN code', pin);
    add(p + 'cctry', 'Country', 'India');
    add(p + 'catype', 'Address type', 'Residential');
  }
  const last4 = String(aad.id_number || '').replace(/\D/g, '').slice(-4);
  if (last4.length === 4) { add(p + 'poa', 'Proof of address', 'A', 'A – Aadhaar'); add(p + 'poa_aadhaar', 'Aadhaar (last 4 digits)', last4); }
  return out;
}

/* run DigiLocker for one holder: create request, open Digio window, read the response. Returns {kid, resp} or null. */
async function dlFetch(h, identifier){
  const n = h[1];
  const req = await esignApi('/kyc/create', { identifier, name: DER('H' + n + 'NAME') || '', reference: S.meta.ref + '-' + h });
  await loadDigio();
  const ok = await new Promise(resolve => {
    const opts = { environment: ESIGN_CFG.environment, is_iframe: true, theme: { primaryColor: '#1f3a2e', secondaryColor: '#ffffff' },
      callback: r => { if (r && r.error_code) { toast('DigiLocker was not completed: ' + (r.message || r.error_code)); resolve(false); } else resolve(true); } };
    if (ESIGN_CFG.logo) opts.logo = ESIGN_CFG.logo;
    const dg = new window.Digio(opts); dg.init(); dg.submit(req.id, identifier, req.access_token && (req.access_token.id || req.access_token));
  });
  if (!ok) return null;
  toast('Reading the DigiLocker documents…');
  let resp = null;
  for (let i = 0; i < 6; i++) { resp = await esignApi('/kyc/response?id=' + encodeURIComponent(req.id)); const { aad, pan } = dlDetails(resp); if (aad.name || pan.id_number) break; await new Promise(r => setTimeout(r, 2500)); }
  return { kid: req.id, resp };
}
function dlRecord(h, kid, resp, fields){
  const { aad, pan } = dlDetails(resp);
  S.meta.digilocker = S.meta.digilocker || {};
  S.meta.digilocker[h] = { id: kid, at: new Date().toISOString(), name: String(aad.name || pan.name || '').trim().toUpperCase(), aadhaar_last4: String(aad.id_number || '').replace(/\D/g, '').slice(-4), fields: fields || [] };
}
/* fill only the KYC entries that are still empty */
function dlApplyEmpty(h, resp){
  const done = [];
  const p = 'k' + h[1] + '_';
  // name parts and address parts go together: if the client already typed any of them, leave the whole group alone
  const groups = [['fname', 'mname', 'lname'], ['ca1', 'ca2', 'ccity', 'cdist', 'cstate', 'cpin', 'cctry', 'catype'], ['poa', 'poa_aadhaar']].map(g => g.map(x => p + x));
  const skip = new Set(); groups.forEach(g => { if (g.some(k => filled(k) && !(k.endsWith('cctry') || k.endsWith('catype')))) g.forEach(k => skip.add(k)); });
  dlMap(h, resp).forEach(r => { if (!skip.has(r.k) && !filled(r.k)) { S.values[r.k] = r.val; S.touched[r.k] = 1; done.push(r.k); } });
  return done;
}
async function dlStart(h){

  modal('<h2>Fill from DigiLocker</h2><p class="sub">' + ES_LABEL[h] + '. The holder logs in to DigiLocker with their Aadhaar and OTP and agrees to share their Aadhaar and PAN. Name, date of birth, gender, PAN and address are then filled on the KYC page. You can check every value before it is filled.' +
    (prev ? ' Last fetched ' + fmtDate(prev.at.slice(0, 10)) + '.' : '') + '</p>' +
    '<fieldset class="esg"><legend>' + ES_LABEL[h] + '</legend><label>Mobile (to identify the holder)<input data-k="mobile" inputmode="numeric" maxlength="10" value="' + esc(g.mobile) + '"></label><label>or E-mail<input data-k="email" type="email" value="' + esc(g.email) + '"></label></fieldset>' +
    '<div class="row"><button class="dbtn" data-a="x">Cancel</button><button class="dbtn primary" data-a="go">Continue to DigiLocker</button></div>', d => {
    d.querySelector('[data-a="x"]').onclick = closeModal;
    d.querySelector('[data-a="go"]').onclick = async () => {

      if (!mobile && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return toast('Enter a mobile number or e-mail.');
      const identifier = mobile || email.toLowerCase(), btn = d.querySelector('[data-a="go"]'); btn.disabled = true; btn.textContent = 'Opening DigiLocker…';

function dlReview(h, kid, resp){
  const rows = dlMap(h, resp);
  if (!rows.length) { modal('<h2>No details received</h2><p class="sub">DigiLocker did not return Aadhaar or PAN details for this request. The holder may not have given consent, or the documents are not in their DigiLocker. You can try again or fill the page by hand.</p><div class="row"><button class="dbtn primary" data-a="x">Close</button></div>', d => d.querySelector('[data-a="x"]').onclick = closeModal); return; }

    '<div class="row"><button class="dbtn" data-a="x">Cancel</button><button class="dbtn primary" data-a="ok">Fill the form</button></div>';
  modal(html, d => {

/* ======================= storage (this browser) ======================= */
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => { try { const r = indexedDB.open('allvest-pms-aof', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  return dbp;
}
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbPut(k, val){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
let saveT = 0, loaded = false;
function scheduleSave(){ if (!loaded) return; clearTimeout(saveT); $('#saved').textContent = 'Saving…'; saveT = setTimeout(saveNow, 700); }
async function saveNow(){
  S.meta.updated = new Date().toISOString();
  try { await idbPut('draft', { values: S.values, touched: S.touched, meta: S.meta }); const t = new Date(); $('#saved').textContent = 'Saved · ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()); }
  catch (e) { $('#saved').textContent = 'Not saved on this device. Use Draft › Save draft to a file.'; }
}
function newRef(){ const d = new Date(); return 'AOF-' + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase(); }
function showRef(){ $('#refline').textContent = 'Reference ' + S.meta.ref + (S.meta.submittedAt ? ' · Submitted ' + fmtDate(S.meta.submittedAt.slice(0, 10)) : ''); }
function applyDefaults(){ F.forEach(f => { const k = KEY(f); if (f.dflt != null && f.dflt !== '' && S.values[k] == null && !S.touched[k]) S.values[k] = f.dflt; }); }

/* ======================= review ======================= */
function docCats(){
  const c = new Set();
  if (IND()) { const r = v('k1_res'); c.add(['Non Resident Indian', 'Person of Indian Origin', 'Foreign National'].includes(r) ? 'nri' : 'ind'); }
  else {
    const t = v('sa_type'), e = v('ni_etype');
    if (t === 'HUF' || e === 'HUF') c.add('huf');
    if (['Company', 'LLP'].includes(t) || ['Private Ltd. Co.', 'Public Ltd. Co.', 'Body Corporate', 'LLP'].includes(e)) c.add('corp');
    if (['Trust', 'Partnership'].includes(t) || ['Trust/Charity/NGO', 'Partnership', 'Society'].includes(e)) c.add('trust');
  }
  return c;
}
function issues(){
  const miss = reqEntries().filter(r => !r.ok).map(r => ({ f: r.f, lbl: r.lbl, why: 'Required', cls: '' }));
  const bad = [];
  const seen = new Set();
  F.forEach(f => { const k = KEY(f); if (seen.has(k) || pageHidden(f.p)) return; seen.add(k); const e = validate(f); if (e) bad.push({ f, lbl: f.lbl, why: e, cls: '' }); });
  const cats = docCats();
  const docs = F.filter(f => f.t === 'upload' && cats.has(f.cat) && !filled(f.id)).map(f => ({ f, lbl: f.lbl, why: 'Document not uploaded (optional here; can be submitted physically)', cls: 'w' }));
  return { miss, bad, docs };
}
let revT = 0;
function scheduleReview(){ clearTimeout(revT); revT = setTimeout(renderReview, 250); }
function renderReview(){
  const { miss, bad, docs } = issues();
  const all = miss.concat(bad).sort((a, b) => a.f.p - b.f.p || F.indexOf(a.f) - F.indexOf(b.f));
  const n = miss.length, m = bad.length;
  $('#revsum').textContent = n || m ? [n ? n + ' required entr' + (n === 1 ? 'y is' : 'ies are') + ' missing' : '', m ? m + ' entr' + (m === 1 ? 'y needs' : 'ies need') + ' correcting' : ''].filter(Boolean).join(' · ') + '. Select an item to jump to it.' : 'All required entries are complete and valid.';
  const st = $('#revstate'); st.className = 'pill ' + (n || m ? 'no' : 'ok'); st.textContent = n || m ? 'Not ready' : 'Ready to submit';
  let h = '', last = 0;
  const row = it => '<button class="iss" data-id="' + it.f.id + '"><span class="pg">p. ' + it.f.p + '</span><span class="t">' + esc(it.lbl) + '<span class="why ' + it.cls + '">' + esc(it.why) + '</span></span></button>';
  all.forEach(it => { if (it.f.p !== last) { last = it.f.p; h += '<h3>Page ' + it.f.p + ' · ' + esc(DATA.titles[it.f.p] || '') + '</h3>'; } h += row(it); });
  if (!all.length) h += '<p class="empty" style="padding:12px 8px">Nothing left to fix. Use Submit to finalise and download the completed form.</p>';
  if (docs.length) { h += '<h3>Supporting documents · checklist</h3>' + docs.map(row).join(''); }
  $('#revlist').innerHTML = h;
}

function loadPdfLib(){
  if (window.PDFLib) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; s.onload = res; s.onerror = () => rej(new Error('pdf-lib failed to load')); document.head.appendChild(s); });
}
const TICK_PATH = 'M 3.5 10.5 L 7.7 14.8 L 16.8 4.8';
async function buildPdf(opts = {}){
  await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const res = await fetch('aof_base.pdf'); if (!res.ok) throw new Error('Could not load the original form');
  const pdf = await PDFDocument.load(await res.arrayBuffer());
  const font = await pdf.embedFont(StandardFonts.Helvetica);
  const ok = {}; const safe = s => { s = String(s).replace(/₹/g, 'Rs.').replace(/[‘’]/g, "'").replace(/[“”]/g, '"'); let o = ''; for (const ch of s) { if (ok[ch] === undefined) { try { font.encodeText(ch); ok[ch] = true; } catch (e) { ok[ch] = false; } } o += ok[ch] ? ch : '?'; } return o; };
  const ink = rgb(0.06, 0.1, 0.23), white = rgb(1, 1, 1);
  const pages = pdf.getPages(), imgs = {};
  const embed = async url => { if (imgs[url]) return imgs[url]; const im = url.startsWith('data:image/png') ? await pdf.embedPng(url) : await pdf.embedJpg(url); return imgs[url] = im; };
  for (const f of F) {
    const k = KEY(f);
    if (['band', 'upload'].includes(f.t) || pageHidden(f.p)) continue; // pages that do not apply stay as printed
    const page = pages[f.p - 1], H = page.getHeight();
    const [x0, y0t, x1, y1t] = f.r, w = x1 - x0, h = y1t - y0t, yb = H - y1t;
    if (f.cover) page.drawRectangle({ x: x0 + 0.5, y: yb + 0.5, width: w - 1, height: h - 1, color: white });
    if (!enabled(f)) continue;
    if (f.t === 'radio' || f.t === 'cb') {
      const hit = f.t === 'radio' ? v(f.g) === f.v : on(f.id); if (!hit) continue;
      const s = Math.min(w, h) * 1.12; page.drawSvgPath(TICK_PATH, { x: x0 + (w - s) / 2, y: yb + (h + s) / 2, scale: s / 20, borderColor: ink, borderWidth: 2.6 });
      continue;
    }
    if (f.t === 'sig' || f.t === 'photo') {
      if (opts.esign && esignBox(f)) continue; // left blank for the Aadhaar eSign stamp
      if (!filled(f.id)) continue;
      const im = await embed(v(f.id));
      if (f.t === 'photo') { page.drawImage(im, { x: x0 + 0.5, y: yb + 0.5, width: w - 1, height: h - 1 }); continue; }
      const k2 = Math.min((w - 4) / im.width, (h - 4) / im.height), iw = im.width * k2, ih = im.height * k2;
      page.drawImage(im, { x: x0 + (w - iw) / 2, y: yb + (h - ih) / 2, width: iw, height: ih });
      continue;
    }
    let txt = display(f); if (!txt) continue;
    if (f.t === 'date' && !/^\d{4}-/.test(v(f.id)) && v(f.id)) continue;
    if (!(LC.has(f.t) || f.uc === 0) && !['calc', 'mirror', 'date'].includes(f.t)) txt = txt.toUpperCase();
    txt = safe(txt);
    if (f.bg) page.drawRectangle({ x: x0 + 0.6, y: yb + 0.6, width: w - 1.2, height: h - 1.2, color: white });
    let size = Math.min(fontPt(f), h * 0.8);
    if (f.t === 'area' || (f.t === 'text' && h > 40 && font.widthOfTextAtSize(txt, size) > w - 4 && f.al !== 'c')) {
      // wrap inside the box
      const lines = s => { const words = txt.split(/\s+/), out = []; let cur = ''; words.forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (font.widthOfTextAtSize(t, s) <= w - 4) cur = t; else { if (cur) out.push(cur); cur = wd; } }); if (cur) out.push(cur); return out; };
      let L = lines(size); while (size > 4.5 && L.length * size * 1.18 > h - 3) { size -= 0.25; L = lines(size); }
      L.forEach((ln, i) => page.drawText(ln, { x: x0 + 2, y: H - y0t - 2 - size * (0.82 + i * 1.18), size, font, color: ink }));
      continue;
    }
    while (size > 4 && font.widthOfTextAtSize(txt, size) > w - 3) size -= 0.25;
    const tw = font.widthOfTextAtSize(txt, size);
    const x = (f.al === 'c' || f.t === 'calc' || f.t === 'mirror') ? x0 + (w - tw) / 2 : x0 + 2;
    page.drawText(txt, { x, y: yb + (h - size * 0.7) / 2, size, font, color: ink });
  }
  // attach uploaded documents
  for (const f of F.filter(x => x.t === 'upload' && filled(x.id) && !pageHidden(x.p))) {
    for (const file of S.values[f.id]) {
      const b = dataToBlob(file.data), bytes = new Uint8Array(await b.arrayBuffer());
      await pdf.attach(bytes, (f.lbl.split(' – ')[0] + ' - ' + file.name).replace(/[\\/:*?"<>|]/g, '_'), { mimeType: file.type, description: f.lbl, creationDate: new Date(file.at || Date.now()), modificationDate: new Date() });
    }
  }
  const data = {}; F.forEach(f => { const k = KEY(f); if (['sig', 'photo', 'upload', 'band'].includes(f.t) || !filled(k) || !enabled(f) || pageHidden(f.p)) return; data[k] = f.t === 'mobile' ? display(f) : v(k); });
  data.risk_profile = risk().prof; data.reference = S.meta.ref; data.account_type = ATYPE_NAME[ATYPE()] || ''; if (S.meta.digilocker) data.digilocker = S.meta.digilocker;
  await pdf.attach(new TextEncoder().encode(JSON.stringify(data, null, 1)), 'application-data.json', { mimeType: 'application/json', description: 'Entered values in machine-readable form' });
  pdf.setTitle('PMS Account Opening Form – ' + S.meta.ref); pdf.setSubject('Allvest PMS Account Opening Form'); pdf.setModificationDate(new Date());
  return await pdf.save();
}
let busy = false;
async function exportPdf(final){
  if (busy) return; busy = true;
  const btn = $('#btnExport'), lbl = btn.textContent; btn.textContent = 'Preparing PDF…'; btn.disabled = true;
  try { const bytes = await buildPdf(); await offerFile('PMS_AOF_' + S.meta.ref + (final ? '' : '_draft') + '.pdf', new Blob([bytes], { type: 'application/pdf' })); return true; }
  catch (e) { console.error(e); toast('The PDF could not be prepared: ' + (e.message || e)); return false; }
  finally { busy = false; btn.textContent = lbl; btn.disabled = false; }
}
async function onExport(){
  const { miss, bad } = issues();
  if (miss.length || bad.length) {
    const ok = await confirmDlg('Download the form as it is now?', 'The form still has ' + (miss.length + bad.length) + ' entr' + (miss.length + bad.length === 1 ? 'y' : 'ies') + ' to complete or correct. You can download a draft PDF of the current entries, or review the open items first.', 'Download draft PDF');
    if (!ok) return;
  }
  exportPdf(false);
}
async function onSubmit(){
  if (esignOn() && esignApi_() && S.meta.esign) return esignPanel();
  const { miss, bad } = issues();
  if (miss.length || bad.length) {
    document.body.classList.add('showreq'); $('#revMark').checked = true; markNeeds(); openReview();
    toast('Complete the items listed in Review before submitting.');
    return;
  }
  const r = risk();
  const sum = '<table style="border-collapse:collapse;font-size:13px;margin:4px 0 0">' + [['Client', DER('H1NAME')], ['Type of account', ATYPE_NAME[ATYPE()] || ''], ['PAN', DER('H1PAN')], ['Mode of holding', v('pta_hold')], ['Proposed investment', v('pta_amt') ? '₹' + inr(v('pta_amt')) : ''], ['Risk profile', r.prof + ' (score ' + r.total + ')'], ['Reference', S.meta.ref]]
    .map(([a, b]) => '<tr><td style="padding:3px 14px 3px 0;color:var(--mute)">' + a + '</td><td style="padding:3px 0;font-weight:500">' + esc(b || '—') + '</td></tr>').join('') + '</table>';
  if (esignOn() && esignApi_()) { const ok2 = await confirmDlg('Submit and eSign this application?', 'The completed form is sent to Digio, and each holder signs it with an Aadhaar OTP. You can download the signed PDF once everyone has signed.' + sum, 'Continue to eSign'); if (ok2) esignStart(); return; }
  if (esignOn()) {
    const ok3 = await confirmDlg('Submit for Aadhaar eSign?', 'A PDF of the completed form is downloaded with the client signature boxes left blank. Upload it on ' + esc(ESIGN_PORTAL) + ' and send it to the holders for Aadhaar eSign.' + sum, 'Download PDF for eSign');
    if (!ok3) return;
    S.meta.submittedAt = new Date().toISOString(); await saveNow(); showRef();
    await esignPortalPdf(); esignPortalGuide(); return;
  }
  const ok = await confirmDlg('Submit this application?', 'Submitting finalises the form and downloads the completed PDF, with your uploaded documents attached inside it.' + sum, 'Submit and download PDF');
  if (!ok) return;
  S.meta.submittedAt = new Date().toISOString(); await saveNow(); showRef();
  const done = await exportPdf(true);
  modal('<h2>Application submitted</h2><p class="sub">Reference <b>' + esc(S.meta.ref) + '</b>. ' + (done ? 'The completed PDF has been offered for download.' : 'The PDF was not downloaded. Use Download PDF to try again.') + ' Your entries stay saved in this browser, so you can reopen the form later.</p><div class="row"><button class="dbtn primary" data-a="x">Close</button></div>', d => d.querySelector('[data-a="x"]').onclick = closeModal);
}

/* ======================= toolbar ======================= */
function setupBar(){
  $('#btnReview').onclick = openReview;
  $('#revClose').onclick = () => { $('#review').hidden = true; };
  $('#revMark').onchange = e => { document.body.classList.toggle('showreq', e.target.checked); if (e.target.checked) markNeeds(); else document.querySelectorAll('.need').forEach(x => x.classList.remove('need')); };
  $('#revlist').addEventListener('click', e => { const b = e.target.closest('.iss'); if (!b) return; const f = byId[b.dataset.id]; if (innerWidth < 900) $('#review').hidden = true; if (f.t === 'upload') { goField(f); setTimeout(() => openDocs(f), 500); } else goField(f); });
  const pop = $('#morepop'), more = $('#btnMore');
  more.onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; more.setAttribute('aria-expanded', String(!pop.hidden)); };
  document.addEventListener('click', e => { if (!pop.hidden && !pop.contains(e.target)) { pop.hidden = true; more.setAttribute('aria-expanded', 'false'); } });
  $('#mSave').onclick = () => { pop.hidden = true; saveDraftFile(); };
  $('#mOpen').onclick = () => { pop.hidden = true; openDraftFile(); };
  $('#mHl').onchange = e => document.body.classList.toggle('nohl', !e.target.checked);
  $('#mClear').onclick = async () => {
    pop.hidden = true;
    const ok = await confirmDlg('Clear the whole form?', 'Every entry, signature, photo and uploaded document on this device will be removed. Save a draft file first if you may need them.', 'Clear everything', true);
    if (!ok) return;
    S.values = {}; S.touched = {}; S.meta = { ref: newRef(), created: new Date().toISOString(), esignMode: S.meta.esignMode, atype: S.meta.atype };
    SHOWN.clear(); document.querySelectorAll('.bad,.need').forEach(e => e.classList.remove('bad', 'need'));
    applyDefaults(); showRef(); changed(); toast('The form has been cleared.');
  };
  $('#btnExport').onclick = onExport;
  $('#btnSubmit').onclick = onSubmit;
}

/* ======================= start ======================= */
(async function init(){
  build(); setupNav(); setupCal(); setupBar(); setupEsign(); setupDigilocker();
  try { const d = await idbGet('draft'); if (d && d.values) { S.values = d.values; S.touched = d.touched || {}; S.meta = d.meta || {}; } } catch (e) {}
  if (!S.meta.ref) S.meta = Object.assign({ ref: newRef(), created: new Date().toISOString() }, S.meta);
  applyDefaults(); showRef(); { const cb = $('#mEsign'); if (cb) cb.checked = esignOn(); }
  loaded = true; refresh();
  $('#saved').textContent = S.meta.updated ? 'Restored · saved ' + fmtDate(S.meta.updated.slice(0, 10)) : 'Autosaves on this device';
  const m = location.hash.match(/^#page(\d+)$/); if (m) setTimeout(() => goPage(+m[1]), 300);
})();
